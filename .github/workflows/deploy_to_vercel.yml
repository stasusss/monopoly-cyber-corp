name: Deploy Flutter Web to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Web (release)
        run: flutter build web --release --no-tree-shake-icons

      - name: Ensure Vercel SPA/COOP config in build output
        run: |
          set -euo pipefail
          test -f web/vercel.json
          cp web/vercel.json build/web/vercel.json
          test -f build/web/vercel.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "Missing secrets.VERCEL_TOKEN"; exit 1; }
          test -n "${VERCEL_ORG_ID:-}" || { echo "Missing secrets.VERCEL_ORG_ID"; exit 1; }
          test -n "${VERCEL_PROJECT_ID:-}" || { echo "Missing secrets.VERCEL_PROJECT_ID"; exit 1; }
          # Deploy compiled static site; existing files win over SPA rewrites.
          vercel deploy build/web --prod --yes --token="$VERCEL_TOKEN"
